name: Rerun notebook

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rerun
  cancel-in-progress: true

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "tensorflow-cpu==2.15.*" "numpy<2" pandas scikit-learn matplotlib seaborn kagglehub nbformat nbclient ipykernel
      - run: python tools/rerun.py
      - name: Commit results
        run: |
          rm -f best_model.h5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MED_ECG_Classification_with_cnn.ipynb RESULTS.md
          git commit -m "Rerun notebook with a separate validation split" || echo "nothing to commit"
          git push
